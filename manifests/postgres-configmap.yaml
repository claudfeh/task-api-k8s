apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  # A ConfigMap carries plain config files into pods.
  # (Secret = sensitive values, ConfigMap = everything else.)
  # In Project 1's Compose file this was a bind mount of ./db/init.sql;
  # this is its Kubernetes equivalent.
  init.sql: |
    CREATE TABLE IF NOT EXISTS tasks (
        id SERIAL PRIMARY KEY,
        title TEXT NOT NULL,
        done BOOLEAN NOT NULL DEFAULT FALSE,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    -- Seed data, runs once when the database volume is first created
    INSERT INTO tasks (title, done) VALUES
        ('Deploy this app with Docker Compose', TRUE),
        ('Add a CI/CD pipeline with GitHub Actions', FALSE),
        ('Write the Terraform infrastructure', FALSE);
